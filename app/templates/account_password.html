{% extends "base.html" %}
{% block title %}{{ _("เปลี่ยนรหัสผ่าน") }} — เจอ.AI{% endblock %}
{% block content %}
<h1>{{ _("เปลี่ยนรหัสผ่าน") }}</h1>
<p class="muted">{{ _("บัญชี {email} · รหัสผ่านใหม่ยาวอย่างน้อย 8 ตัวอักษร", email=email) }}</p>
{% if notice %}<div class="{{ 'ok-banner' if ok else 'err-banner' }}">{{ notice|tr }}</div>{% endif %}
<div class="card" style="max-width:460px">
  <form method="post" action="/account/password" style="display:grid;gap:10px">
    <label>{{ _("รหัสผ่านปัจจุบัน") }}<input type="password" name="current" required autocomplete="current-password"></label>
    <label>{{ _("รหัสผ่านใหม่") }}<input type="password" name="new" required minlength="8" autocomplete="new-password"></label>
    <label>{{ _("ยืนยันรหัสผ่านใหม่") }}<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <div><button class="btn sm" type="submit">{{ _("บันทึกรหัสผ่านใหม่") }}</button></div>
  </form>
</div>
{% endblock %}
