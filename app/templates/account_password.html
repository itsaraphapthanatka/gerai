{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน — เจอ.AI{% endblock %}
{% block content %}
<h1>เปลี่ยนรหัสผ่าน</h1>
<p class="muted">บัญชี {{ email }} · รหัสผ่านใหม่ยาวอย่างน้อย 8 ตัวอักษร</p>
{% if notice %}<div class="{{ 'ok-banner' if ok else 'err-banner' }}">{{ notice }}</div>{% endif %}
<div class="card" style="max-width:460px">
  <form method="post" action="/account/password" style="display:grid;gap:10px">
    <label>รหัสผ่านปัจจุบัน<input type="password" name="current" required autocomplete="current-password"></label>
    <label>รหัสผ่านใหม่<input type="password" name="new" required minlength="8" autocomplete="new-password"></label>
    <label>ยืนยันรหัสผ่านใหม่<input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
    <div><button class="btn sm" type="submit">บันทึกรหัสผ่านใหม่</button></div>
  </form>
</div>
{% endblock %}
