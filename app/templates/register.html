{% extends "base.html" %}
{% block title %}{{ _("สมัครใช้งาน") }} — เจอ.AI{% endblock %}
{% block content %}
<h1>{{ _("สมัครใช้งาน") }}</h1>
{% if error %}<div class="err">{{ error|tr }}</div>{% endif %}
<div class="card" style="max-width:420px">
  <form method="post" action="/register">
    <label>{{ _("ชื่อ") }}</label><input type="text" name="name">
    <label>{{ _("อีเมล") }}</label><input type="email" name="email" required>
    <label>{{ _("รหัสผ่าน") }}</label><input type="password" name="password" required>
    <div style="margin-top:14px"><button type="submit">{{ _("สมัครและเริ่มใช้งาน") }}</button></div>
  </form>
</div>
<p class="muted">{{ _("มีบัญชีแล้ว?") }} <a class="link" href="/login">{{ _("เข้าสู่ระบบ") }}</a></p>
{% endblock %}
