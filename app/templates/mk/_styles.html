{# สไตล์ของหน้าเว็บสาธารณะชุดใหม่ (stage 01) — ต่อยอดโทเคนใน _ds.html (ดำ + ส้มแดงเป็นจุดเน้น, DM Sans + IBM Plex Sans Thai)
   ทุกกฎอยู่ใต้ body.mk เพื่อไม่ไปกระทบหน้าแอป/หลังบ้าน/หน้า hosted ของลูกค้า · ไม่มีไฟล์ CSS ภายนอก ไม่มี build
   เอกสาร: docs/rebuild/UI_SYSTEM.md #}
<style>
  body.mk{
    --mk-ink:var(--primary,#0a0a0a);--mk-slate:var(--slate,#45515e);--mk-hair:var(--hairline,#e5e7eb);--mk-surface:var(--surface,#f7f8fa);
    --mk-coral:var(--coral,#ff5530);--mk-coral-deep:var(--coral-deep,#c8341a);
    --mk-found:#1c7a44;--mk-absent:#8a5a12;--mk-untested:#5f6670;--mk-down:#b42318;
    --mk-radius:14px;--mk-max:1120px;
    margin:0;background:#fff;color:var(--mk-ink);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  body.mk *{box-sizing:border-box}
  body.mk h1,body.mk h2,body.mk h3{line-height:1.25;letter-spacing:-.01em;text-wrap:balance;margin:0}
  body.mk h1{font-size:clamp(28px,5vw,44px);font-weight:700}
  body.mk h2{font-size:clamp(22px,3vw,30px);font-weight:700}
  body.mk h3{font-size:17px;font-weight:600}
  body.mk p{margin:0;max-width:66ch}
  :where(body.mk) a{color:inherit}   /* :where = ไม่เพิ่ม specificity ไม่ทับสีของปุ่มที่เป็นลิงก์ */
  .mk-wrap{max-width:var(--mk-max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mk-section{padding-block:48px}
  .mk-stack{display:grid;gap:16px}
  .mk-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
  .mk-eyebrow{font-size:12.5px;font-weight:600;color:var(--mk-coral-deep);text-transform:uppercase;letter-spacing:.06em}
  .mk-muted{color:var(--mk-slate)} .mk-small{font-size:13.5px}
  .mk-mono{font-family:ui-monospace,'IBM Plex Mono',Consolas,monospace;font-size:.9em;font-variant-numeric:tabular-nums}
  .mk-skip{position:absolute;left:-9999px;top:8px;background:var(--mk-ink);color:#fff;padding:8px 14px;border-radius:9999px;z-index:100}
  .mk-skip:focus{left:12px}

  /* nav + footer */
  .mk-nav{border-bottom:1px solid var(--mk-hair);background:#fff}
  .mk-nav .mk-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap}
  .mk-nav ul{list-style:none;display:flex;gap:6px 18px;flex-wrap:wrap;margin:0;padding:0;font-size:14.5px}
  .mk-nav a{text-decoration:none;color:var(--mk-slate)} .mk-nav a:hover,.mk-nav a[aria-current]{color:var(--mk-ink)}
  .mk-foot{border-top:1px solid var(--mk-hair);padding-block:28px;font-size:13.5px;color:var(--mk-slate)}
  .mk-foot .mk-wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}
  .mk-foot ul{list-style:none;display:flex;gap:6px 18px;flex-wrap:wrap;margin:0;padding:0}

  /* buttons: one primary per decision */
  .mk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9999px;padding:12px 22px;font:600 15px var(--font);border:1.5px solid var(--mk-ink);cursor:pointer;text-decoration:none;line-height:1.2}
  .mk-btn-primary{background:var(--mk-ink);color:#fff} .mk-btn-primary:hover{background:#222}
  .mk-btn-secondary{background:#fff;color:var(--mk-ink)} .mk-btn-secondary:hover{background:var(--mk-surface)}
  .mk-btn-text{border-color:transparent;background:transparent;color:var(--mk-ink);text-decoration:underline;text-underline-offset:3px;padding-inline:4px}
  .mk-btn[disabled],.mk-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
  body.mk :focus-visible{outline:3px solid var(--mk-coral);outline-offset:2px}

  /* status: shape + word + colour; coral is never a status colour */
  .mk-st{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
  .mk-st i{width:12px;height:12px;flex:none;display:inline-block;border-radius:50%}
  .mk-st-found{color:var(--mk-found)} .mk-st-found i{background:var(--mk-found)}
  .mk-st-absent{color:var(--mk-absent)} .mk-st-absent i{border:2px solid var(--mk-absent)}
  .mk-st-partial{color:var(--mk-absent)} .mk-st-partial i{border:2px solid var(--mk-absent);background:linear-gradient(90deg,var(--mk-absent) 50%,transparent 50%)}
  .mk-st-not_tested{color:var(--mk-untested)} .mk-st-not_tested i{border:2px dashed var(--mk-untested)}
  .mk-st-unavailable{color:var(--mk-down)} .mk-st-unavailable i{border:2px solid var(--mk-down);background:linear-gradient(135deg,transparent 42%,var(--mk-down) 42%,var(--mk-down) 58%,transparent 58%)}

  /* cards */
  .mk-card{border:1px solid var(--mk-hair);border-radius:var(--mk-radius);padding:16px;display:grid;gap:8px;background:#fff;min-width:0;align-content:start}
  .mk-meta{font-size:12.5px;color:var(--mk-slate)}
  .mk-quote{margin:0;border-left:3px solid var(--mk-coral);padding-left:12px;font-size:15px;overflow-wrap:anywhere}
  .mk-facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin:0}
  .mk-facts dt{color:var(--mk-slate)} .mk-facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .mk-order-n{font-weight:700;color:var(--mk-coral-deep);font-variant-numeric:tabular-nums;margin-right:8px}
  .mk-lbl{font-size:11.5px;padding:0 7px;border-radius:9999px;border:1px solid currentColor;margin-left:6px;white-space:nowrap}
  .mk-lbl-confirmed{color:var(--mk-found)} .mk-lbl-inferred{color:var(--mk-absent)}
  .mk-cover{display:grid;gap:6px}
  .mk-cover-bar{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px}
  .mk-cover-bar span{height:8px;border-radius:9999px;background:var(--mk-ink)}
  .mk-cover-bar span.no{background:transparent;border:1.5px dashed var(--mk-untested)}

  /* forms */
  .mk-field{display:grid;gap:6px}
  .mk-field label{font-weight:600;font-size:14.5px}
  .mk-field input,.mk-field select,.mk-field textarea{font:16px var(--font);padding:11px 14px;border:1.5px solid var(--mk-hair);border-radius:12px;background:#fff;color:var(--mk-ink);width:100%}
  .mk-field-err input{border-color:var(--mk-down)}
  .mk-help{font-size:13px;color:var(--mk-slate)} .mk-err{font-size:13.5px;color:var(--mk-down);font-weight:500}
  .mk-hp{position:absolute;left:-9999px}

  /* empty, media, faq */
  .mk-empty{border:1.5px dashed var(--mk-hair);border-radius:var(--mk-radius);padding:22px;display:grid;gap:8px;justify-items:start;background:var(--mk-surface)}
  .mk-media{aspect-ratio:16/9;max-width:100%;border-radius:var(--mk-radius);background:var(--mk-surface);border:1px solid var(--mk-hair);display:grid;place-items:center;text-align:center;padding:20px;overflow:hidden}
  .mk-media img{width:100%;height:100%;object-fit:cover}
  .mk-faq details{border-bottom:1px solid var(--mk-hair);padding:14px 0}
  .mk-faq summary{cursor:pointer;font-weight:600;list-style-position:outside}
  .mk-faq details p{margin-top:8px;color:var(--mk-slate)}

  /* mobile action bar: visible only on narrow screens */
  .mk-actbar{display:none}
  @media (max-width:720px){
    .mk-actbar{display:flex;gap:8px;position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--mk-hair);
      padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
    .mk-actbar .mk-btn{flex:1;padding:11px 12px;font-size:14.5px}
  }
  @media (prefers-reduced-motion:reduce){body.mk *{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
