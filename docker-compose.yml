services:
  geo-postgres:
    image: postgres:16
    container_name: geo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: geo_platform
    # bind localhost only — never exposed to the internet
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - geo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  geo-app:
    build: .
    image: geo-platform:latest
    container_name: geo-app
    restart: unless-stopped
    depends_on:
      geo-postgres:
        condition: service_healthy
    env_file: .env
    # resolve ผ่าน DNS สาธารณะ ไม่ใช่ของเราเตอร์ — ตัวมอนิเตอร์ตัดสินว่าเว็บลูกค้าล่มหรือไม่
    # จากการ resolve ชื่อ ถ้าเราเตอร์แคชคำตอบเสียไว้ เราจะแจ้งเตือนผิดให้ลูกค้าทุกราย
    # (เกิดจริง 30 ก.ย. 2026: เราเตอร์ค้างคำตอบ "ไม่มีเรคคอร์ด" ของ appreview.cloud
    #  ต่ออีกเป็นชั่วโมงหลังแก้ DNS เสร็จแล้ว ทั้งที่ 1.1.1.1 และ 8.8.8.8 ตอบถูกทันที)
    # ชื่อ container (geo-postgres) ยังใช้ได้ตามปกติ — Docker embedded DNS จัดการก่อน
    # แล้วค่อยส่งต่อเฉพาะชื่อภายนอกมาที่นี่
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # lets the container reach host services (litellm on :4000) via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # reachable only via the reverse proxy / cloudflare tunnel on the host
    ports:
      - "127.0.0.1:8095:8095"
    # runtime-written data — must outlive the container, and .dockerignore keeps
    # it out of the image. NOTE: BASE is /app/app (app/main.py), so generated
    # images live at /app/app/static/gen, not /app/static/gen.
    volumes:
      - ./uploads:/app/uploads
      - ./app/static/gen:/app/app/static/gen
    # รายงาน PDF เรนเดอร์ผ่าน container pdf (ด้านล่าง) — ถ้าไม่มี แอปยังทำงานได้ แค่ปุ่ม PDF จะบอกให้ใช้ Print
    environment:
      - PDF_SERVICE_URL=http://pdf:3000

  # Gotenberg = Chromium แปลง HTML → PDF ผ่าน HTTP — ใช้ทำรายงานรายเดือน (/brands/{id}/report.pdf)
  # ไม่เปิดพอร์ตออกนอก geo-app เรียกผ่านเครือข่ายภายในเท่านั้น
  # ฟอนต์ Sarabun ใน deploy/fonts (OFL) mount ให้ ไม่งั้นภาษาไทยในรายงานเป็นกล่องสี่เหลี่ยม
  pdf:
    image: gotenberg/gotenberg:8
    container_name: geo-pdf
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=90s", "--chromium-disable-javascript=true"]
    volumes:
      - ./deploy/fonts:/usr/share/fonts/sarabun:ro

volumes:
  geo-pg-data:
