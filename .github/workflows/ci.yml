# CI — build the app image, then run every *_smoke.py inside it (same command as on the server).
# pg_smoke.py runs against a real Postgres 16 container, and the image is started the way the server starts it.
# The job is named "test": the server's pull-based deploy waits for this check to pass on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -q -t geo-platform:ci .

      # ของจริงใช้ Postgres แต่สเมอก์เทสต์ด้านล่างรันบน SQLite — ขั้นนี้จับ SQL ที่ผ่าน SQLite แต่พังบน Postgres
      # และพิสูจน์ว่า image ที่จะ deploy เริ่มได้จริงแบบเดียวกับบนเซิร์ฟเวอร์: โฟลเดอร์ข้อมูลเป็นของ root, แอปไม่ได้รันเป็น root
      - name: Postgres and container checks
        run: |
          docker run -d --name ci-pg -e POSTGRES_USER=geo -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=geo_platform \
            -p 127.0.0.1:55432:5432 postgres:16
          for i in $(seq 60); do docker exec ci-pg pg_isready -h 127.0.0.1 -U geo -d geo_platform -q && break; sleep 1; done
          DB=postgresql://geo:ci-only@127.0.0.1:55432/geo_platform

          docker run --rm --network host -v "$PWD:/src" -w /src -e DATABASE_URL="$DB" geo-platform:ci python pg_smoke.py

          # ci-data จัดโฟลเดอร์เหมือนโปรเจกต์บนเซิร์ฟเวอร์ (deploy/, uploads/, app/static/gen/) ให้ backup.sh/restore.sh รันกับมันได้
          mkdir -p ci-data/deploy ci-data/uploads/slips ci-data/app/static/gen
          cp deploy/backup.sh deploy/restore.sh ci-data/deploy/ && sudo chown -R root:root ci-data
          docker run -d --name ci-app --network host -e DATABASE_URL="$DB" -e SESSION_SECRET=ci-only-not-a-real-secret \
            -v "$PWD/ci-data/uploads:/app/uploads" -v "$PWD/ci-data/app/static/gen:/app/app/static/gen" geo-platform:ci
          for i in $(seq 60); do curl -fsS -o /dev/null http://127.0.0.1:8095/login && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8095/login || { docker logs ci-app; exit 1; }
          uid="$(docker exec ci-app awk '/^Uid:/ {print $2}' /proc/1/status)"
          [ "$uid" = "10001" ] || { echo "แอปควรรันเป็น uid 10001 แต่เป็น $uid"; exit 1; }
          docker exec -u app ci-app sh -c 'echo ok > /app/uploads/slips/ci-write && echo ok > /app/app/static/gen/ci-write' \
            || { echo "ผู้ใช้ app เขียนโฟลเดอร์ข้อมูลไม่ได้"; exit 1; }
          if docker exec -u app ci-app sh -c 'echo x >> /app/app/main.py' 2> /dev/null; then echo "ผู้ใช้ app ไม่ควรแก้โค้ดได้"; exit 1; fi
          echo "pg_smoke OK · แอปเริ่มได้บน Postgres · รันเป็น uid $uid · เขียนได้เฉพาะโฟลเดอร์ข้อมูล"

          # สำรองแล้วกู้ไฟล์เมื่อโฟลเดอร์ข้อมูลเป็นของ uid 10001: ผู้ใช้ที่รันสคริปต์ (runner) อ่านไฟล์ 600 และเขียนลงโฟลเดอร์ไม่ได้
          # ทั้งสองทางต้องผ่าน container — restore.sh ทำตอนแอปหยุดอยู่
          docker exec -u app ci-app sh -c 'echo slip > /app/uploads/slips/keep.jpg && chmod 600 /app/uploads/slips/keep.jpg && echo img > /app/app/static/gen/keep.png'
          export BACKUP_DIR="$PWD/ci-backups" PG_CONTAINER=ci-pg APP_CONTAINER=ci-app STOP_CMD="docker stop ci-app" START_CMD="docker start ci-app"
          bash ci-data/deploy/backup.sh
          docker exec -u app ci-app rm /app/uploads/slips/keep.jpg /app/app/static/gen/keep.png
          bash ci-data/deploy/restore.sh "$(ls -d ci-backups/20* | tail -1)" --yes
          [ "$(sudo cat ci-data/uploads/slips/keep.jpg)" = "slip" ] && [ "$(sudo cat ci-data/app/static/gen/keep.png)" = "img" ] \
            || { echo "restore.sh ไม่ได้กู้ไฟล์กลับมา"; exit 1; }
          owner="$(sudo stat -c %u ci-data/uploads/slips/keep.jpg)"
          [ "$owner" = "10001" ] || { echo "ไฟล์ที่กู้ควรเป็นของ uid 10001 แต่เป็น $owner"; exit 1; }
          for i in $(seq 60); do curl -fsS -o /dev/null http://127.0.0.1:8095/login && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8095/login || { echo "แอปไม่กลับมาหลังกู้"; docker logs ci-app; exit 1; }
          echo "สำรองและกู้ไฟล์ผ่าน container OK · ไฟล์ที่กู้เป็นของ uid $owner · แอปกลับมาหลังกู้"
          docker rm -f ci-app ci-pg > /dev/null
          sudo rm -rf ci-data ci-backups

      - name: Smoke tests
        run: |
          mkdir -p ci-logs
          ls *_smoke.py | grep -vx 'pg_smoke.py' \
            | xargs -P 4 -I{} sh -c 'docker run --rm -v "$PWD:/src" -w /src -e SESSION_SECRET=ci-only-not-a-real-secret geo-platform:ci python {} > ci-logs/{}.log 2>&1 && echo "PASS {}" || echo "FAIL {}"' \
            | sort > results.txt
          cat results.txt
          echo "passed $(grep -c '^PASS' results.txt) of $(wc -l < results.txt)"
          if grep -q '^FAIL' results.txt; then
            for f in $(grep '^FAIL' results.txt | cut -d' ' -f2); do
              echo "::group::$f"; tail -40 "ci-logs/$f.log"; echo "::endgroup::"
            done
            exit 1
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ci-logs/
          retention-days: 7

  # Backup → damage → restore against the same Postgres image production runs (deploy/BACKUP.md).
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        run: |
          printf 'POSTGRES_PASSWORD=ci-only\n' > .env
          docker compose up -d --wait geo-postgres

      - name: Backup and restore round trip
        run: bash deploy/backup_restore_test.sh
